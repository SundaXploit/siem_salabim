<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" fill="none" role="img" aria-labelledby="demo-title demo-description">
  <title id="demo-title">Demo SIEM Salabim — video placeholder</title>
  <desc id="demo-description">Sampul video placeholder SIEM Salabim dengan tombol putar besar. Klik untuk membuka video contoh di YouTube. Gambar ini bukan tangkapan layar aplikasi dan tautan contoh bukan rekaman demo aplikasi.</desc>
  <defs>
    <linearGradient id="demo-background" x1="0" y1="0" x2="1200" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1427"/>
      <stop offset="0.55" stop-color="#0D1D30"/>
      <stop offset="1" stop-color="#10363D"/>
    </linearGradient>
    <radialGradient id="demo-glow" cx="0" cy="0" r="1" gradientTransform="translate(933 294) rotate(90) scale(300 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#30BCB4" stop-opacity="0.19"/>
      <stop offset="1" stop-color="#30BCB4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="demo-button" x1="820" y1="228" x2="965" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91F2E7"/>
      <stop offset="1" stop-color="#36C8C6"/>
    </linearGradient>
    <pattern id="demo-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#AADCD8" fill-opacity="0.085"/>
    </pattern>
  </defs>

  <rect width="1200" height="640" rx="24" fill="url(#demo-background)"/>
  <rect width="1200" height="640" rx="24" fill="url(#demo-glow)"/>
  <rect x="640" y="1" width="559" height="638" rx="24" fill="url(#demo-dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="23.5" stroke="#6C9AAA" stroke-opacity="0.25"/>
  <path d="M610 0L795 640" stroke="#90DED8" stroke-opacity="0.08"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="64" y="54" width="217" height="35" rx="17.5" fill="#203744" stroke="#537880" stroke-opacity="0.6"/>
    <circle cx="84" cy="71.5" r="4" fill="#84DDD3"/>
    <text x="99" y="76" fill="#B7DDD9" font-size="11" font-weight="700" letter-spacing="1.7">VIDEO PLACEHOLDER</text>
    <text x="1137" y="78" text-anchor="end" fill="#9BB4C6" font-size="13" font-weight="700" letter-spacing="2.5">SIEM SALABIM</text>

    <text x="60" y="222" fill="#F1F7FC" font-size="71" font-weight="700" letter-spacing="-2.7">Demo SIEM</text>
    <text x="60" y="301" fill="#77E6DB" font-size="71" font-weight="700" letter-spacing="-2.7">Salabim</text>
    <path d="M65 337H119" stroke="#57D8CE" stroke-width="3" stroke-linecap="round"/>
    <text x="64" y="387" fill="#A9BECF" font-size="20">Klik untuk membuka video contoh di YouTube</text>

    <g transform="translate(64 428)">
      <rect width="220" height="47" rx="12" fill="#C2E6E3" fill-opacity="0.07" stroke="#74A5AB" stroke-opacity="0.3"/>
      <path d="M20 15L33 23.5L20 32V15Z" fill="#8BDFD6"/>
      <text x="48" y="29" fill="#D1E5EB" font-size="14" font-weight="600">Buka video contoh</text>
      <path d="M190 19H198V27M188 29L198 19" stroke="#9EBFC8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g>
    <circle cx="907" cy="295" r="185" stroke="#71D9D0" stroke-opacity="0.09"/>
    <circle cx="907" cy="295" r="143" stroke="#72DED5" stroke-opacity="0.14"/>
