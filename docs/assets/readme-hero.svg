    <text x="113" y="73" fill="#E5F5F8" font-size="19" font-weight="700" letter-spacing="3">SIEM SALABIM</text>

    <text x="61" y="165" fill="#F1F7FC" font-size="61" font-weight="700" letter-spacing="-2.3">Dari alert</text>
    <text x="61" y="233" fill="#66E1D7" font-size="61" font-weight="700" letter-spacing="-2.3">ke tindakan.</text>
    <text x="65" y="278" fill="#A8BACD" font-size="19">Wazuh dan OpenSearch, terhubung dengan</text>
    <text x="65" y="306" fill="#A8BACD" font-size="19">triage terpusat dan analisis AI.</text>

