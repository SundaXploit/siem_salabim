<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="hero-title hero-description">
  <title id="hero-title">SIEM Salabim — Dari alert ke tindakan.</title>
  <desc id="hero-description">Banner SIEM Salabim bernuansa navy dan cyan, dengan ilustrasi abstrak alur alert, triage, dan tindakan. Integrasi Wazuh, OpenSearch, triage, dan analisis AI. Ilustrasi bukan tangkapan layar aplikasi atau data operasional.</desc>
  <defs>
    <linearGradient id="hero-background" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1326"/>
      <stop offset="0.58" stop-color="#0A1728"/>
      <stop offset="1" stop-color="#102C36"/>
    </linearGradient>
    <linearGradient id="hero-accent" x1="764" y1="80" x2="1120" y2="319" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46DCD4"/>
      <stop offset="1" stop-color="#6DBBEF"/>
    </linearGradient>
    <linearGradient id="hero-panel" x1="756" y1="55" x2="1139" y2="343" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13283B"/>
      <stop offset="1" stop-color="#0E1D30"/>
    </linearGradient>
    <radialGradient id="hero-glow" cx="0" cy="0" r="1" gradientTransform="translate(1015 201) rotate(90) scale(299 352)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1BA6A1" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#1BA6A1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#9DEDE6" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#hero-background)"/>
  <rect width="1200" height="400" rx="24" fill="url(#hero-glow)"/>
  <rect x="632" y="1" width="567" height="398" rx="24" fill="url(#hero-grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="23.5" stroke="#678997" stroke-opacity="0.2"/>
  <path d="M665 0L596 400" stroke="#9EEDE4" stroke-opacity="0.08"/>

  <g font-family="Segoe UI, Arial, sans-serif">
