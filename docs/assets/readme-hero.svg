      <rect width="34" height="34" rx="10" fill="#4ADDD3" fill-opacity="0.11" stroke="#4ADDD3" stroke-opacity="0.3"/>
      <path d="M17 7L25 10V17C25 22 21 25 17 27C13 25 9 22 9 17V10L17 7Z" stroke="#6BE7DF" stroke-width="1.7" stroke-linejoin="round"/>
