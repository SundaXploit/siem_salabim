name: Publish verified release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16.16
        env:
          POSTGRES_DB: siem_pgsql_test
          POSTGRES_PASSWORD: ci-postgres-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d siem_pgsql_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: siem_mysql_test
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=ci-root-only --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: siem_mariadb_test
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sqlite3, pdo_pgsql, pgsql, pdo_mysql, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Verify tag and VERSION
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v$(tr -d '\r\n' < VERSION)"
          [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Verify database test configurations
        run: |
          test -f phpunit.xml.dist
          test -f phpunit.pgsql.xml.dist
          test -f phpunit.mysql.xml.dist

      - name: Install and build frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build

      - name: Run PHP test suite
        run: php artisan test

      - name: Create restricted PostgreSQL test role
        env:
          PGPASSWORD: ci-postgres-only
        run: >-
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1
          -c "CREATE ROLE siem_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'ci-siem-test-only';"
          -c "ALTER DATABASE siem_pgsql_test OWNER TO siem_test;"

      - name: Run PostgreSQL test suite
        env:
          DB_DATABASE: siem_pgsql_test
          DB_USERNAME: siem_test
          DB_PASSWORD: ci-siem-test-only
          DB_SSLMODE: disable
        run: php vendor/bin/phpunit --configuration phpunit.pgsql.xml.dist

      - name: Create restricted MySQL and MariaDB test users
        env:
          TEST_SQL_ROOT_PASSWORD: ci-root-only
        run: |
          php <<'PHP'
          <?php
          foreach ([3306, 3307] as $port) {
              $pdo = new PDO('mysql:host=127.0.0.1;port='.$port, 'root', getenv('TEST_SQL_ROOT_PASSWORD'), [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
              // Disposable CI service only: fault-injection triggers must be
              // creatable by the restricted test user without SUPER privileges.
              if ($port === 3306) {
                  $pdo->exec('SET GLOBAL log_bin_trust_function_creators = 1');
              }
              $pdo->exec("CREATE USER 'siem_test'@'%' IDENTIFIED BY 'ci-siem-test-only'");
              $pdo->exec("GRANT ALL PRIVILEGES ON `siem\\_%`.* TO 'siem_test'@'%'");
          }
          PHP

      - name: Run MySQL test suite
        env:
          DB_DATABASE: siem_mysql_test
          DB_USERNAME: siem_test
          DB_PASSWORD: ci-siem-test-only
        run: php vendor/bin/phpunit --configuration phpunit.mysql.xml.dist

      - name: Run MariaDB test suite
        env:
          DB_CONNECTION: mariadb
          DB_PORT: '3307'
          DB_DATABASE: siem_mariadb_test
          DB_USERNAME: siem_test
          DB_PASSWORD: ci-siem-test-only
          SIEM_SQL_TEST_DRIVER: mariadb
          SIEM_ACK_TEST_DRIVER: mariadb
          SIEM_NOTIFY_TEST_DRIVER: mariadb
        run: php vendor/bin/phpunit --configuration phpunit.mysql.xml.dist

      - name: Install production dependencies
        run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress

      - name: Verify production platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Assemble immutable update artifact
        shell: bash
        run: |
          set -euo pipefail
          release_root="dist/siem-salabim"
          test ! -e dist
          mkdir -p "${release_root}"
          git archive --format=tar HEAD -- \
            . \
            ':(exclude).github' \
            ':(exclude)bootstrap/cache' \
            ':(exclude)phpunit.xml' \
            ':(exclude)phpunit.xml.dist' \
            ':(exclude)phpunit.pgsql.xml' \
            ':(exclude)phpunit.pgsql.xml.dist' \
            ':(exclude)phpunit.mysql.xml' \
            ':(exclude)phpunit.mysql.xml.dist' \
            ':(exclude)storage' \
            ':(exclude)tests' \
            | tar -xf - -C "${release_root}"
          rsync -a vendor/ "${release_root}/vendor/"
          rsync -a public/build/ "${release_root}/public/build/"
          release_commit="$(git rev-parse --verify HEAD^{commit})"
          php scripts/build-release-manifest.php "${release_root}" "${release_commit}" "${GITHUB_REF_NAME}"
          asset="siem-salabim-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -X -q -r "${asset}" siem-salabim)
          asset_bytes="$(stat --format=%s "dist/${asset}")"
          test "${asset_bytes}" -gt 0
          test "${asset_bytes}" -le 314572800
          (cd dist && sha256sum "${asset}" > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
          unzip -tq "dist/${asset}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="dist/siem-salabim-${GITHUB_REF_NAME}.zip"
          gh release create "${GITHUB_REF_NAME}" \
            "${asset}" \
            dist/SHA256SUMS \
            dist/siem-salabim/release-manifest.json \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "SIEM Salabim ${GITHUB_REF_NAME}"
          gh release edit "${GITHUB_REF_NAME}" --draft=false
