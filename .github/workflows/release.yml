name: Publish verified release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  databases:
    uses: ./.github/workflows/databases.yml
    permissions:
      contents: read

  release:
    needs: databases
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sqlite3, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Verify tag and VERSION
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v$(tr -d '\r\n' < VERSION)"
          [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Install and build frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build

      - name: Run PHP test suite
        run: php artisan test

      - name: Install production dependencies
        run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress

      - name: Verify production platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Assemble immutable update artifact
        shell: bash
        run: |
          set -euo pipefail
          release_root="dist/siem-salabim"
          test ! -e dist
          mkdir -p "${release_root}"
          git archive --format=tar HEAD -- \
            . \
            ':(exclude).github' \
            ':(exclude)bootstrap/cache' \
            ':(exclude)phpunit.xml' \
            ':(exclude)storage' \
            ':(exclude)tests' \
            | tar -xf - -C "${release_root}"
          rsync -a vendor/ "${release_root}/vendor/"
          rsync -a public/build/ "${release_root}/public/build/"
          release_commit="$(git rev-parse --verify HEAD^{commit})"
          php scripts/build-release-manifest.php "${release_root}" "${release_commit}" "${GITHUB_REF_NAME}"
          asset="siem-salabim-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -X -q -r "${asset}" siem-salabim)
          asset_bytes="$(stat --format=%s "dist/${asset}")"
          test "${asset_bytes}" -gt 0
          test "${asset_bytes}" -le 314572800
          (cd dist && sha256sum "${asset}" > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
          unzip -tq "dist/${asset}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="dist/siem-salabim-${GITHUB_REF_NAME}.zip"
          gh release create "${GITHUB_REF_NAME}" \
            "${asset}" \
            dist/SHA256SUMS \
            dist/siem-salabim/release-manifest.json \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "SIEM Salabim ${GITHUB_REF_NAME}"
          gh release edit "${GITHUB_REF_NAME}" --draft=false
